repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
    -   id: check-added-large-files

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0  # Usa la versión más reciente
    hooks:
    -   id: ruff
        args: [ --fix ] # Corrige automáticamente errores simples
    -   id: ruff-format # Reemplaza a Black, es mucho más rápido
