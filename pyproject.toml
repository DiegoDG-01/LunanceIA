[project]
name = "lunance"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aiomysql==0.3.2",
    "alembic==1.18.4",
    "fastapi==0.135.3",
    "greenlet==3.3.2",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    "pymysql==1.1.2",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "sqlalchemy==2.0.49",
    "uvicorn==0.43.0",
    "cryptography==46.0.7",
    "python-multipart==0.0.26",
    "bcrypt==5.0.0",
    "google-genai==1.70.0",
    "email-validator==2.3.0",
    "pillow==12.2.0",
    "apscheduler==3.11.2",
    "pytz==2026.1",
    "google-auth==2.49.1",
    "google-auth-oauthlib==1.3.1",
    "google-api-python-client==2.193.0",
    "cachetools==5.5.2",
    "pydantic-ai-slim[google,openai]==1.77.0",
    "fastapi-advanced-rate-limiter==2.1.0",
    "redis==7.4.0",
    "secure==1.0.1",
    "openai>=2.30.0",
]

[dependency-groups]
test = [
    "aiosqlite==0.22.1",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "httpx==0.28.1",
    "pytest-cov==7.0.0",
]

dev = [
    "maturin==1.12.6",
    "virtualenv==20.36.1",
    "ruff==0.14.3",
    "pre-commit==4.3.0",
    "locust==2.32.0",
]

typecheck = [
    "pyrefly==0.57.1",
]

[tool.uv]
exclude-dependencies = [
    "ecdsa",
]

[tool.ruff]
exclude = ["src/tests", "alembic/", "src/run_tests.py"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "alembic/*",
    "src/main.py",
    "src/__init__.py"
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\b\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "alembic/**",
    "terraform/**",
    "htmlcov/**",
    "http/**",
    "sql/**",
    "docs/**",
]
