[project]
name = "lunance"
version = "0.1.0"
description = "API REST de finanzas personales construida con FastAPI y Clean Architecture"
readme = "README.md"
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Diego DG", email = "contacto@diegodg.com.mx" },
]
keywords = ["fastapi", "finanzas", "clean-architecture", "ddd", "cqrs"]
dependencies = [
    "aiomysql==0.3.2",
    "alembic==1.18.4",
    "fastapi==0.140.0",
    "greenlet==3.5.0",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.14.2",
    "pymysql==1.2.0",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "sqlalchemy==2.0.51",
    "uvicorn==0.43.0",
    "cryptography==48.0.1",
    "python-multipart==0.0.31",
    "bcrypt==5.0.0",
    "google-genai==2.4.0",
    "email-validator==2.3.0",
    "pillow==12.3.0",
    "apscheduler==3.11.2",
    "pytz==2026.2",
    "google-auth==2.53.0",
    "google-auth-oauthlib==1.4.0",
    "google-api-python-client==2.196.0",
    "cachetools==7.1.2",
    "pydantic-ai-slim[google,openai]==2.16.0",
    "fastapi-advanced-rate-limiter==2.1.0",
    "redis==7.4.0",
    "secure==1.0.1",
    "openai>=2.37.0",
    "python-dateutil>=2.9.0.post0",
    "numpy==2.4.6",
]

[project.urls]
Repository = "https://github.com/DiegoDG-01/LunanceIA"
Documentation = "https://github.com/DiegoDG-01/LunanceIA/tree/master/docs"
Issues = "https://github.com/DiegoDG-01/LunanceIA/issues"

[dependency-groups]
test = [
    "aiosqlite==0.22.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
]

dev = [
    "maturin==1.12.6",
    "virtualenv==20.36.1",
    "ruff==0.14.3",
    "pre-commit==4.3.0",
    "locust==2.32.0",
]

mcp = [
    "mcp[cli]>=1.27.2",
    "httpx>=0.28.1"
]

typecheck = [
    "pyrefly==0.57.1",
]

[tool.uv]
exclude-dependencies = [
    "ecdsa",
]

[tool.ruff]
exclude = ["src/tests", "alembic/", "src/run_tests.py"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "alembic/*",
    "src/main.py",
    "src/__init__.py"
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\b\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "alembic/**",
    "terraform/**",
    "htmlcov/**",
    "http/**",
    "sql/**",
    "docs/**",
]
