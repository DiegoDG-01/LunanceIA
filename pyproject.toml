[project]
name = "lunance"
version = "2.0.0"
description = "API REST de finanzas personales construida con FastAPI y Clean Architecture"
readme = "README.md"
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Diego DG", email = "contacto@diegodg.com.mx" },
]
keywords = ["fastapi", "finanzas", "clean-architecture", "ddd", "cqrs"]
dependencies = [
    "aiomysql==0.3.2",
    "alembic==1.20.1",
    "fastapi==0.163.1",
    "greenlet==3.5.6",
    "pydantic[email]==2.14.3",
    "pydantic-settings==2.16.3",
    "pymysql==1.2.4",
    "python-dotenv==1.2.4",
    "pyjwt[crypto]==2.15.1",
    "argon2-cffi==25.1.0",
    "sqlalchemy==2.1.8",
    "uvicorn==0.54.0",
    "cryptography==50.0.2",
    "python-multipart==0.0.33",
    "bcrypt==5.0.0",
    "google-genai==3.3.0",
    "email-validator==2.4.0",
    "pillow==13.0.0",
    "apscheduler==3.11.3",
    "pytz==2026.6",
    "google-auth==2.62.2",
    "google-auth-oauthlib==1.5.0",
    "google-api-python-client==2.202.0",
    "cachetools==8.0.0",
    "pydantic-ai-slim[google,openai]==2.66.0",
    "redis==8.1.0",
    "secure==2.0.1",
    "openai==3.51.0",
    "python-dateutil==4.0.0",
    "numpy==2.5.5",
    "httpx==0.28.1",
]

[project.urls]
Repository = "https://github.com/DiegoDG-01/LunanceIA"
Documentation = "https://github.com/DiegoDG-01/LunanceIA/tree/master/docs"
Issues = "https://github.com/DiegoDG-01/LunanceIA/issues"

[dependency-groups]
test = [
    "aiosqlite==0.22.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
    "fakeredis==2.40.0",
]

dev = [
    "maturin==1.16.0",
    "virtualenv==21.15.6",
    "ruff==0.17.5",
    "pre-commit==4.7.0",
    "locust==2.47.0",
]

mcp = [
    "mcp[cli]==2.3.0",
    "httpx>=0.28.1",
    "pydantic-settings==2.16.3",
]

typecheck = [
    "pyrefly==1.4.1",
]

[tool.ruff]
exclude = ["src/tests", "alembic/", "src/run_tests.py"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = ["obsolete"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config",
    "--color=yes",
    "--durations=10",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "auth: marks tests related to authentication",
    "api: marks tests for API endpoints",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "alembic/*",
    "src/main.py",
    "src/__init__.py"
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\b\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "alembic/**",
    "terraform/**",
    "htmlcov/**",
    "http/**",
    "sql/**",
    "docs/**",
]

[tool.ruff.lint.per-file-ignores]
  "src/presentation/dependencies/*.py" = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "presentation.dependencies.auth_deps.require_scope",
]
