# Docker Compose configuration for Lunance application
# Defines a multi-container setup with FastAPI backend and MySQL database

services:
  # FastAPI application service
  api:
    build: .                    # Build from local Dockerfile
    ports:
      - "8000:8000"            # Map host port 8000 to container port 8000
    depends_on:
      db:
        condition: service_healthy  # Wait until MySQL is ready to accept connections
      redis:
        condition: service_healthy  # Rate limits y sesiones
    env_file:
      - .env                   # Load environment variables from .env file
    environment:
      # Sobrescribe REDIS_URL de .env: dentro de Docker, Redis se alcanza por nombre de servicio
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lunance_redis}@redis:6379/0
      # Con EMAIL_BACKEND=smtp (DEV), el correo va al servicio `mailpit` (perfil dev).
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    networks:
      - lunance-net           # Connect to custom network

  # MCP server service (expone las tools financieras de Lunance por streamable-http)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8001:8001"           # MCP streamable-http
    depends_on:
      - api                   # El MCP reenvía las peticiones a la API
    environment:
      # (2) Saliente: MCP -> API, por el nombre de servicio en la red interna
      - LUNANCE_API_BASE_URL=http://api:8000
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      # (1) Entrante: quién puede llamar AL MCP en local. En prod se usa el dominio real.
      - MCP_ALLOWED_HOSTS=localhost:8001,127.0.0.1:8001,mcp:8001
      - MCP_ALLOWED_ORIGINS=http://localhost:8001,http://127.0.0.1:8001
    networks:
      - lunance-net

  # MySQL database service
  db:
    image: mysql:8.0          # Use official MySQL 8.0 image
    container_name: lunance_db
    restart: always           # Restart container if it stops
    volumes:
      - mysql_data:/var/lib/mysql  # Persist database data
    environment:
      # Database configuration
      - MYSQL_DATABASE=lunance       # Create application database
      - MYSQL_USER=luna              # Create application user
      - MYSQL_PASSWORD=luna_root      # Set password for application user
      - MYSQL_ROOT_PASSWORD=root     # Set root password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "luna", "-pluna_root"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lunance-net                 # Connect to custom network

  # Redis: rate limits y, desde la fase 1, sesiones revocadas.
  # Sin persistencia a propósito: lo importante de las sesiones vive en MySQL y que los
  # contadores de rate limit se reinicien no importa. Sin puertos publicados: solo la red interna.
  redis:
    image: redis:7-alpine
    container_name: lunance_redis
    restart: always
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:-lunance_redis}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:-lunance_redis}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lunance-net

  # Mailpit: buzón falso para desarrollo. Recibe por SMTP todo lo que manda la API con
  # EMAIL_BACKEND=smtp (verificación de correo, recuperación de contraseña) y lo muestra en
  # http://localhost:8025. El SMTP (1025) solo se alcanza desde la red interna.
  # Solo arranca con el perfil dev: `docker compose --profile dev up`. En producción el correo
  # sale por Resend.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: lunance_mailpit
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # UI web, solo en esta máquina
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - lunance-net

# Named volumes for data persistence
volumes:
  mysql_data:             # Persistent storage for MySQL data

# Custom networks for service communication
networks:
  lunance-net:               # Isolated network for application services
    driver: bridge           # Use bridge network driver
