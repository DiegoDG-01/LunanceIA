  name: Stage Deploy

  on:
    push:
      branches: [ stage ]

  jobs:
    build-and-push:
      runs-on: self-hosted

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Extract Metadata
          id: meta
          uses: docker/metadata-action@v6
          with:
            images: diegodg01/lunance-api
            tags: |
              type=raw,value=stage
              type=sha,prefix=stage-

        - name: Build and Push
          uses: docker/build-push-action@v5
          with:
            context: .
            platforms: linux/arm64
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=registry,ref=diegodg01/lunance-api:buildcache
            cache-to: type=registry,ref=diegodg01/lunance-api:buildcache,mode=max

        - name: Trigger Dokploy Stage deployment
          if: success()
          run: |
            curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              ${{ secrets.DOKPLOY_PROD_WEBHOOK }}
