  name: Stage MCP Deploy

  on:
    push:
      branches: [ stage ]
      paths:
        - 'src/presentation/mcp/**'
        - 'Dockerfile.mcp'
        - 'pyproject.toml'
        - 'uv.lock'
        - '.github/workflows/stage-mcp-image.yml'

  jobs:
    build-and-push:
      runs-on: self-hosted

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Extract Metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: diegodg01/lunance-api          # mismo repo privado, tag mcp-*
            tags: |
              type=raw,value=mcp-stage
              type=sha,prefix=mcp-stage-

        - name: Build and Push
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile.mcp
            platforms: linux/arm64
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=registry,ref=diegodg01/lunance-api:mcp-stage-buildcache
            cache-to: type=registry,ref=diegodg01/lunance-api:mcp-stage-buildcache,mode=max

        - name: Trigger Dokploy Stage MCP deployment
          if: success()
          run: |
            curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              ${{ secrets.DOKPLOY_MCP_PROD_WEBHOOK }}
