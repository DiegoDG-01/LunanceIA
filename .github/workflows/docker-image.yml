name: docker-image.yml
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: diegodg01/lunance-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64  # ⬅️ Solo x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=diegodg01/lunance-api:buildcache
          cache-to: type=registry,ref=diegodg01/lunance-api:buildcache,mode=max

      - name: Trigger n8n webhook for deployment
        if: success()
        run: |
          # Extraer solo el primer tag (dev)
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)

          curl -X POST \
            -H "Content-Type: application/json" \
            -d "{
              \"image\": \"${IMAGE_TAG}\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"repository\": \"${{ github.repository }}\"
            }" \
            ${{ secrets.N8N_WEBHOOK_URL }}