name: docker-image.yml
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests
        run: uv run pytest
        env:
          # JWT (Valores de prueba, no necesitas los reales de prod)
          SECRET_KEY: "super-secret-test-key-of-at-least-32-characters"
          SECRET_KEY_REFRESH: "super-secret-test-key-of-at-least-42-characters"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7

          # External APIs (Tokens falsos con formato válido para que Pydantic no de error)
          BANXICO_TOKEN: "mock-token-123"
          AUTH0_DOMAIN: "test-domain.auth0.com"
          AUTH0_AUDIENCE: "https://api.lunance.app"
          GEMINI_MODEL_ID: "gemini-2.5-flash"
          GEMINI_API_KEY: "mock-gemini-key-123"

          # API Config
          ENVIRONMENT: "TEST"

          # Database
          DB_HOST: "localhost"
          DB_PORT: 3306
          DB_NAME: "lunance_test"
          DB_USER: "luna"
          DB_PASSWORD: "CHANGE_ME"

          # Logging & Monitoring
          LOG_PROVIDER: "console"
          LOG_LEVEL: "INFO"
          LOG_FORMAT: "text"

          # Loki
          LOKI_URL: "http://localhost:3100"
          LOKI_USERNAME: "CHANGE_ME"
          LOKI_PASSWORD: "CHANGE_ME"
          LOKI_APP_NAME: "lunance-test"
          LOKI_ENV: "development"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: diegodg01/lunance-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64  # ⬅️ Solo x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=diegodg01/lunance-api:buildcache
          cache-to: type=registry,ref=diegodg01/lunance-api:buildcache,mode=max

      - name: Trigger Dokploy deployment
        if: success()
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            http://192.168.1.222:3000/api/deploy/5ARMUu6CW4cVJZjlD7Gc0
