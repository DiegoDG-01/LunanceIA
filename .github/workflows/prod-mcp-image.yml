  name: Production MCP Deploy

  on:
    workflow_dispatch:

  jobs:
    build-and-push:
      runs-on: self-hosted

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Extract Metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: diegodg01/lunance-api          # mismo repo privado, distinto tag
            # tag por SHA (mcp-prod-<sha>) = ancla de rollback por commit
            tags: |
              type=raw,value=mcp-latest
              type=sha,prefix=mcp-prod-

        - name: Build and Push
          uses: docker/build-push-action@v5
          with:
            context: .
            file: Dockerfile.mcp                   # el Dockerfile renombrado
            platforms: linux/amd64
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
            cache-from: type=registry,ref=diegodg01/lunance-api:mcp-buildcache
            cache-to: type=registry,ref=diegodg01/lunance-api:mcp-buildcache,mode=max

        - name: Trigger Dokploy MCP Production deployment
          if: success()
          run: |
            curl -s -o /dev/null -w "%{http_code}" \
              -X POST \
              ${{ secrets.DOKPLOY_MCP_PROD_WEBHOOK }}
