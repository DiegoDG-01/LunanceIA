name: Security Scan

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  schedule:
    # Escaneo semanal los lunes a las 9 AM
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permite ejecutar manualmente

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: self-hosted
    permissions:
      contents: read
      security-events: write
      actions: read # Necesario para self-hosted runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up old Docker images
        run: |
          docker image prune -af --filter "until=24h" || true
          docker builder prune -af --filter "until=24h" || true

      - name: Build Docker image
        run: |
          docker build -t lunance:${{ github.sha }} .
          docker tag lunance:${{ github.sha }} lunance:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'lunance:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1' # Falla el build si encuentra vulnerabilidades

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() # Sube resultados incluso si el scan falla
        continue-on-error: true # No falla si no puede subir (útil para repos privados sin Advanced Security)
        with:
          sarif_file: 'trivy-results.sarif'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF as artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Run Trivy for human-readable output
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: 'lunance:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Cleanup after scan
        if: always()
        run: |
          docker rmi lunance:${{ github.sha }} || true
          docker rmi lunance:latest || true
